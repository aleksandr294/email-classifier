version: '3.8'

services:
  db:
    image: postgres:16.0
    restart: always
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "15000:5432"
    volumes:
      - db_local_data:/var/lib/postgresql/data
    networks:
      - network_test

networks:
  network_test:
    driver: bridge

volumes:
  db_local_data: