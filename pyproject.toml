[project]
name = "email-classifier"
version = "0.1.0"
description = ""
authors = [
    {name = "Oleksandr Balashenko"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "black (>=25.12.0,<26.0.0)",
    "ruff (>=0.14.13,<0.15.0)",
    "sqlalchemy[asyncio] (>=2.0.45,<3.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "fastapi-pagination (>=0.15.6,<0.16.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "anthropic (>=0.103.1,<0.104.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "python-magic (>=0.4.27,<0.5.0)",
    "loguru (>=0.7.3) ; python_version >= \"3.12\" and python_version < \"4.0\""
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
force-exclude = "migrations"


[tool.ruff]
lint.select = ["I001", "E402", "Q000", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "F401", "F541", "E712", "W291", "E302"]
lint.ignore = []
lint.fixable = []
lint.unfixable = []
line-length = 120
exclude = ["migrations", "venv", ".venv", ".env"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = [
    "S101",
    "ANN201"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"